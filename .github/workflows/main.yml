name: Check MAFF Vegetable

on:
  schedule:
    # 毎日 朝9時(日本時間)に実行 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動で実行するためのボタンを表示

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
